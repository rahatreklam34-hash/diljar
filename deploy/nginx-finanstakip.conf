# FinansTakip - Nginx yapılandırması
# /etc/nginx/sites-available/finanstakip  (ardından sites-enabled'a symlink)

server {
    server_name diljar.com www.diljar.com;

    # Frontend (Vite build çıktısı)
    root /var/www/finanstakip/packages/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # API isteklerini Node backend'e yönlendir
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # index.html HER ZAMAN taze sunulur (eski surum / onbellek sorununu onler)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback - tüm yollar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlık önbelleği (hash'li dosyalar -> uzun sureli)
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/diljar.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/diljar.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = diljar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name diljar.com www.diljar.com;
    return 404; # managed by Certbot


}
