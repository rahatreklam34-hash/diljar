# FinansTakip - Nginx yapılandırması
# /etc/nginx/sites-available/finanstakip  (ardından sites-enabled'a symlink)
# Alan adınızı (server_name) ve frontend dist yolunu kendi kurulumunuza göre ayarlayın.

server {
    listen 80;
    server_name diljar.com www.diljar.com;

    # Frontend (Vite build çıktısı)
    root /var/www/finanstakip/packages/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # API isteklerini Node backend'e yönlendir
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback - tüm yollar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlık önbelleği
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# NOT: SSL için "sudo certbot --nginx -d diljar.com -d www.diljar.com" çalıştırın.
# certbot, 443 dinleyen bir server bloğu ekleyip 80'i otomatik yönlendirir.
